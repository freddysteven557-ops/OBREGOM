<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f172a;
        --ink: #f8fafc;
        --accent: #facc15;
        --font-display: "Archivo Black", sans-serif;
        --font-body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #card {
        width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #title {
        color: var(--ink); font-family: var(--font-display);
        font-size: 150px; letter-spacing: 0.02em; line-height: 1;
      }
      #title span { display: inline-block; }
      #bar { width: 0; height: 14px; margin: 48px 0 40px; background: var(--accent); border-radius: 7px; }
      #subtitle {
        color: var(--accent); font-family: var(--font-body); font-weight: 700;
        font-size: 64px; letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <h1 id="title"><span>O</span><span>B</span><span>R</span><span>E</span><span>G</span><span>O</span><span>M</span></h1>
        <div id="bar"></div>
        <p id="subtitle">Edición de video</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#title span", { y: 140, scale: 0.6, rotation: 8, duration: 0.7, ease: "back.out(1.8)", stagger: 0.07 }, 0);
      tl.to("#bar", { width: 560, duration: 0.6, ease: "power3.inOut" }, 1.1);
      tl.from("#subtitle", { y: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, 1.5);
      tl.to("#title", { scale: 1.06, duration: 2.2, ease: "none" }, 2.1);
      tl.to(["#title", "#bar", "#subtitle"], { opacity: 0, y: -40, duration: 0.45, ease: "power2.in", stagger: 0.05 }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
